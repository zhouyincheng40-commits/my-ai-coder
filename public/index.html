<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Omni AI Studio</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="hero">
      <div>
        <p class="badge">Hugging Face + 多模型路由</p>
        <h1>My Omni AI Studio</h1>
        <p>
          一个类似主流 AI 平台的统一工作台：支持 AI 视频、AI 代码、AI 写作、AI 换脸、聊天助手，
          并可切换 Hugging Face / OpenAI Compatible / 自定义模型端点。
        </p>
      </div>
      <div class="card status" id="providerStatus">加载中...</div>
    </header>

    <main class="grid">
      <section class="card">
        <h2>全局模型路由</h2>
        <label>Provider
          <select id="provider"></select>
        </label>
        <label>Model ID
          <input id="model" value="Qwen/Qwen2.5-7B-Instruct" />
        </label>
        <label>自定义 Endpoint（可选）
          <input id="endpoint" placeholder="https://..." />
        </label>
      </section>

      <section class="card">
        <h2>AI 聊天</h2>
        <textarea id="chatInput" rows="5" placeholder="输入你的问题..."></textarea>
        <button id="sendChat">发送聊天请求</button>
      </section>

      <section class="card">
        <h2>AI 任务中心</h2>
        <label>任务类型
          <select id="taskType">
            <option value="code">AI 代码</option>
            <option value="writing">AI 写作</option>
            <option value="video">AI 视频</option>
            <option value="face-swap">AI 换脸</option>
          </select>
        </label>
        <textarea id="taskInput" rows="4" placeholder="例如：帮我写一个登录页面；生成短视频脚本；换脸提示词..."></textarea>
        <button id="runTask">执行任务</button>
      </section>

      <section class="card output">
        <h2>结果输出</h2>
        <pre id="output">等待请求...</pre>
      </section>
    </main>

    <script type="module" src="app.js"></script>
  </body>
</html>
